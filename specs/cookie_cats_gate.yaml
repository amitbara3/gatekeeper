# Pre-registration spec: Cookie Cats progression gate
#
# COMMITTED BEFORE ANY ANALYSIS RUN (Rules R1.2).
#
# Treatment is `gate_40` (gate moved later, to level 40); control is `gate_30`.
# Effects are reported as treatment minus control.
#
# Do not edit this file to match a result. If the plan needs to change after seeing
# data, create a NEW spec file with `mode: exploratory`.

name: cookie_cats_gate
dataset: cookie_cats
registered_on: "2026-08-17"
mode: confirmatory

# ---------------------------------------------------------------------------
# Metrics
# ---------------------------------------------------------------------------
# PRD O2 resolved: retention_7 is primary.
#
# Reasoning -- decision relevance, not effect size. Seven-day retention is the
# metric that maps onto long-run engagement and monetisation, so it is the number a
# team would actually decide on. One-day retention largely measures whether the
# player came back at all, which the gate placement (encountered well into the first
# session for most players) has less claim to influence.
#
# Deliberately NOT chosen on the basis of which metric shows a larger or clearer
# effect -- that would be the exact failure pre-registration prevents.
primary_metric: retention_7
direction: higher_is_better

guardrail_metrics:
  - retention_1
  - sum_gamerounds

# PRD: Cookie Cats carries essentially no pre-treatment covariates (only userid),
# so there is no honest basis for subgroup analysis. Declaring none is the correct
# answer, not an omission -- see Phases.md Phase 7.
declared_subgroups: []

# ---------------------------------------------------------------------------
# Decision thresholds
# ---------------------------------------------------------------------------
alpha: 0.05
power: 0.80

# Design MDE for retention_7 at ~45k units/arm and a ~19% base rate.
# To be verified by design/power.py in Phase 2 -- if the computed MDE differs,
# THIS FILE IS WRONG and gets corrected before Phase 3, not after.
mde: 0.0075

# PRD O3 resolved: 1 percentage point on retention_7.
#
# Reasoning: at a ~19% base rate, 1pp is a ~5% relative change in seven-day
# retention -- large enough to matter commercially, small enough to be detectable
# at this sample size. Note the constraint the validator enforces: the threshold
# must be at least the MDE, or a null result cannot distinguish "no meaningful
# effect" from "underpowered".
#
# This number is a judgement call. It is written down before analysis so that it is
# a judgement call rather than a rationalisation.
practical_threshold: 0.01

# ---------------------------------------------------------------------------
# Design
# ---------------------------------------------------------------------------
expected_shares:
  gate_30: 0.5
  gate_40: 0.5

srm_threshold: 0.0005   # Kohavi's recommendation; strict because it runs every time
min_per_arm: 100

# The dataset has no timestamps, so accrual order is unobservable and there is no
# way to peek even in principle. Fixed horizon, read once.
stopping_rule: fixed_horizon

# ---------------------------------------------------------------------------
# Analysis choices
# ---------------------------------------------------------------------------
multiplicity_method: benjamini_hochberg

# R1.6: declared BEFORE looking at the tail.
#
# sum_gamerounds is severely right-skewed and is known to contain at least one
# extreme value. Winsorising at p99.9 is applied identically to both arms. Phase 3
# reports results with AND without the rule, so the rule's influence is visible
# rather than buried.
outlier_rules:
  - metric: sum_gamerounds
    method: winsorize
    percentile: 99.9

notes: >
  Analysis plan for the Cookie Cats gate-placement experiment. Retention metrics are
  analysed with a two-proportion test; sum_gamerounds is severely skewed and is
  analysed with a bootstrap rather than a t-test (R1.12).

  sum_gamerounds appears here as a guardrail OUTCOME only. It is measured after the
  player meets the gate, so it is a mediator and must never be used as a covariate
  or CUPED adjustment (R1.7) -- enforced by ExperimentData.assert_pre_treatment.
